name: shervice_flutter
description: "A new Flutter project."

# Prevent accidental publishing to pub.dev
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  # The web plugin must be indented exactly like this
  flutter_web_plugins:
    sdk: flutter
  # Re-added the default cupertino icons just in case you need them
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.15.0
  flutter_facebook_auth: ^7.1.7
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# The flutter section is where assets and UI configs live
flutter:
  uses-material-design: true
  
  # Assets must be nested under the flutter section, exactly 2 spaces in
  assets:
    - assets/logo.jpg
    - assets/shervice.jpg
    - assets/shervice - white.jpg